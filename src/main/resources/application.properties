server.port=8080
spring.application.name=book-my-tree-core

# PostgreSQL + PostGIS Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/bookmytree_master_db
spring.datasource.username=postgres
spring.datasource.password=secretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate & Spatial Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Apache Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=book-my-tree-group
spring.kafka.consumer.auto-offset-reset=earliest

#--

# --- Database & PGVector Configuration ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/bookmytree
# spring.datasource.username=postgres
# spring.datasource.password=postgres

# Spring AI PGVector Vector Store settings
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=384
# Default dimension for all-MiniLM-L6-v2 used by spring-ai-transformers is 384

# --- Gemini API via OpenAI Compatibility Layer ---
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.options.model=gemini-3.8-flash
spring.ai.openai.chat.options.temperature=0.7

# --- Free Transformers Embeddings Configuration ---
spring.ai.embedding.transformer.metadata.use-document-id=true